<!DOCTYPE html>
<html>
<head>
    <title>PetCloud</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="container">

        <form name="f1" action="AnimalServlet" method="GET">

            <h1>🐾 PETCLOUD</h1>

            <div class="campo">
                <label>Nome</label>
                <input type="text" name="txtnome">
            </div>

            <div class="campo">
                <label>Espécie</label>
                <input type="text" name="txtespecie">
            </div>

            <div class="campo">
                <label>Raça</label>
                <input type="text" name="txtraca">
            </div>

            <div class="campo">
                <label>Idade</label>
                <input type="text" name="txtidade">
            </div>

            <div class="campo">
                <label>Sexo</label>
                <input type="text" name="txtsexo">
            </div>

            <div class="campo">
                <label>Porte</label>
                <input type="text" name="txtporte">
            </div>

            <div class="campo">
                <label>Cor</label>
                <input type="text" name="txtcor">
            </div>

            <div class="campo">
                <label>Peso</label>
                <input type="text" name="txtpeso">
            </div>

            <div class="campo">
                <label>
                    <input type="checkbox" name="txtvacinado">
                    Vacinado
                </label>
            </div>

            <div class="campo">
                <label>
                    <input type="checkbox" name="txtcastrado">
                    Castrado
                </label>
            </div>

            <div class="campo">
                <label>Descrição</label>
                <input type="text" name="txtdescricao">
            </div>

            <div class="campo">
                <label>Status da Adoção</label>
                <input type="text" name="txtstatusAdocao">
            </div>

            <div class="campo">
                <label>Contato Responsável</label>
                <input type="text" name="txtcontatoResponsavel">
            </div>

            <div class="botoes">
                <input type="submit" name="op" value="CADASTRAR">
                <input type="submit" name="op" value="CONSULTAR TODOS">
            </div>

        </form>

    </div>

</body>
</html>
